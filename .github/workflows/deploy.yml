name: "Deploy"

# chamado pelos workflows de dev (develop), hom (release/*) e prod (main)
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        default: ""
      plan_only:
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  Test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  Terraform:
    name: Build & Terraform (${{ inputs.environment }})
    needs: Test
    runs-on: ubuntu-latest
    # lambda na vpc demora pra soltar as enis no destroy
    timeout-minutes: 45
    environment: ${{ inputs.environment }}

    concurrency:
      group: lambda-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      TFVARS: inventories/${{ inputs.environment }}/terraform.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda package
        run: sh scripts/build.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-dev
          aws-region: us-east-1

      - name: Read flags from tfvars
        id: flags
        working-directory: infra
        run: |
          FUNCTION_NAME=$(grep -E '^function_name\s*=' $TFVARS | awk -F '=' '{gsub(/[" ]/, "", $2); print $2}')
          DESTROY=$(grep -E '^destroy\s*=' $TFVARS | awk -F '=' '{gsub(/[[:space:]]/, "", $2); print $2}')
          echo "FUNCTION_NAME=$FUNCTION_NAME" >> $GITHUB_OUTPUT
          echo "DESTROY=$DESTROY" >> $GITHUB_OUTPUT
          echo "ENV=${{ inputs.environment }} FUNCTION_NAME=$FUNCTION_NAME DESTROY=$DESTROY"

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=g52-terraform-state-dev-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=${{ inputs.environment }}/${{ steps.flags.outputs.FUNCTION_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        if: inputs.plan_only
        working-directory: infra
        run: terraform plan -var-file=$TFVARS

      - name: Terraform Destroy
        if: ${{ !inputs.plan_only && steps.flags.outputs.DESTROY == 'true' }}
        working-directory: infra
        run: terraform destroy -auto-approve -var-file=$TFVARS

      - name: Terraform Apply
        if: ${{ !inputs.plan_only && steps.flags.outputs.DESTROY != 'true' }}
        working-directory: infra
        run: terraform apply -auto-approve -var-file=$TFVARS

      - name: Smoke test (JWKS)
        if: ${{ !inputs.plan_only && steps.flags.outputs.DESTROY != 'true' }}
        run: |
          aws lambda invoke \
            --function-name "${{ steps.flags.outputs.FUNCTION_NAME }}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"httpMethod":"GET","path":"/.well-known/jwks.json","headers":{}}' \
            response.json
          cat response.json
          jq -e '.statusCode == 200' response.json
